server:
  port: 8080

spring:
  application:
    name: order-service
  datasource:
    url: jdbc:h2:mem:tea_mates
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: none # Ensures tables are created before inserting data
    show-sql: true
    database-platform: org.hibernate.dialect.H2Dialect
  sql:
    init:
      mode: always  # Forces execution of data.sql on every restart
  h2:
    console:
      enabled: true
      path: /h2-console

management:
  endpoints:
    web:
      exposure:
        include: "*"

  endpoint:
    health:
      enabled: true

# FLAW: review feature config mixed into order-service application.yaml without separation
review:
  auto-approve: true        # FLAW: auto-approves all reviews – no moderation
  max-rating: 10            # FLAW: inconsistent with ReviewService which expects 1-5

# FLAW: coupon config not validated against actual Coupon entity limits
coupon:
  max-usage-per-customer: 1
  default-expiry-days: 30   # FLAW: not used anywhere in code

# FLAW: notification config references SMTP but no mail dependency in pom.xml
notification:
  email:
    enabled: false           # FLAW: silently disables email, no logging when disabled
    from: noreply@ceylonteamates.com
  sms:
    enabled: false

